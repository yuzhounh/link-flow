</style></head><body><main><div class="brand"><img class="logo" src="__APP_ICON__" alt="">LinkFlow</div><h1>手机与电脑，随手互传</h1><p class="lead">配对一次，下次自动连接。</p><div class="steps"><p><b>1. 打开电脑端 LinkFlow</b><br>手机与电脑连接同一个 Wi-Fi。</p><p><b>2. 在电脑端打开“扫码连接”</b><br>点击下方按钮，用手机摄像头扫描二维码。</p></div><a class="connect" href="linkflow://scan">摄像头扫码连接</a><a class="connect secondary" href="linkflow://pair">粘贴配对链接</a><a class="connect secondary" href="linkflow://retry">重连已配对电脑</a><p class="hint">电脑需保持运行。连接后可在设置中更换电脑或重新扫码。</p></main></body></html>
