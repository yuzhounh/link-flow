<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LinkFlow - 私人文件传输助手</title>
  <meta name="theme-color" content="#f7f7f7" id="theme-color-meta">
  <link rel="manifest" href="/manifest.json?v=2">
  <link rel="icon" href="/icon.png?v=2" type="image/png">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
  <div id="app-container">
    <!-- Header -->
    <header>
      <div class="header-left">
        <div class="app-avatar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </div>
        <div class="header-title-box">
          <div class="app-title">
            <span>文件传输助手</span>
            <span id="device-tag" style="font-size:11px;font-weight:normal;color:var(--text-sub);padding:1px 6px;border-radius:4px;background:var(--border-color);">电脑端</span>
          </div>
          <div class="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">正在连接...</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn btn-qr" id="open-qr-btn" title="手机扫码配对">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>扫码连接</span>
        </button>

        <button class="icon-btn" id="toggle-search-btn" title="搜索记录">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <button class="icon-btn" id="open-settings-btn" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Collapsible Search Bar -->
    <div id="search-bar">
      <input type="text" id="search-input" placeholder="搜索文字内容或文件名 (按回车过滤)...">
      <button class="icon-btn" id="close-search-btn" title="清除搜索">✕</button>
    </div>

    <!-- Chat History Flow -->
    <main id="chat-history">
      <!-- Dynamic messages injected here -->
    </main>

    <!-- Footer Input Bar -->
    <footer>
      <div class="input-toolbar">
        <div class="tool-buttons">
          <!-- Direct camera capture for mobile (Redmi K80 Pro) -->
          <label class="tool-btn" title="拍照直接上传" style="cursor:pointer;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
          </label>

          <!-- Photo / Video upload -->
          <label class="tool-btn" title="图片/视频" style="cursor:pointer;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <input type="file" id="media-input" accept="image/*,video/*" multiple style="display:none;">
          </label>

          <!-- Any File upload (PDF, ZIP, DOC, etc.) -->
          <label class="tool-btn" title="发送任意文件" style="cursor:pointer;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
            <input type="file" id="file-input" multiple style="display:none;">
          </label>
        </div>


      </div>

      <div class="input-row">
        <textarea id="message-input" rows="1" placeholder="输入文字，可拖拽文件或直接 Ctrl+V 粘贴截图..."></textarea>
        <button class="send-btn" id="send-btn">
          <span>发送</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>

    <!-- Drag and Drop Overlay -->
    <div id="drop-zone">
      <div class="drop-icon">📂</div>
      <h2 style="font-size:22px;font-weight:600;">释放文件立即传输</h2>
      <p style="font-size:14px;opacity:0.9;">支持图片、视频、PDF、ZIP 等任意文件</p>
    </div>
  </div>

  <!-- QR Code Modal -->
  <div class="modal-mask" id="qr-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">📱 手机扫码直连</div>
        <button class="close-btn" id="close-qr-modal">✕</button>
      </div>
      <div style="font-size:13px;color:var(--text-sub);text-align:center;">
        请确保手机与电脑已连接在<strong>同一个 Wi-Fi</strong>网络下
      </div>
      <div id="qr-canvas-container"></div>
      <div class="qr-info-url" id="qr-url-text">http://...</div>
      <div id="ip-switch-box" style="display:none;font-size:12px;color:var(--text-sub);text-align:center;">
        <span>可选 IP: </span>
        <select id="ip-select" style="font-size:12px;padding:3px 8px;border-radius:4px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-main);"></select>
      </div>
      <div class="modal-footer">
        <button class="send-btn" id="copy-url-btn" style="background-color:var(--border-color);color:var(--text-main);">复制链接</button>
        <button class="send-btn" id="done-qr-btn">完成</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-mask" id="settings-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">⚙️ 传输助手设置</div>
        <button class="close-btn" id="close-settings-modal">✕</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-size:14px;font-weight:500;">手机文本自动存入 PC 剪贴板</div>
            <div style="font-size:12px;color:var(--text-sub);">手机发送的文本直接写入电脑 Windows 剪贴板</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="setting-auto-clipboard" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-size:14px;font-weight:500;">深色模式 (Dark Theme)</div>
            <div style="font-size:12px;color:var(--text-sub);">随心切换明亮或暗黑外观</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="setting-dark-theme">
            <span class="slider"></span>
          </label>
        </div>

        <div style="border-top:1px solid var(--border-color);padding-top:12px;display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:12px;color:var(--text-sub);" id="storage-stats-text">
            正在统计存储状态...
          </div>
          <button class="send-btn" id="clear-all-btn" style="background-color:#ff4d4f;color:#fff;">
            清空所有聊天记录与已存文件
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Image Lightbox Modal -->
  <div id="lightbox-mask">
    <img id="lightbox-img" src="" alt="预览大图">
  </div>

  <!-- Toast Notification -->
  <div id="toast">已复制到剪贴板</div>

  <script src="/js/qrcode.min.js"></script>
  <script src="/js/app.js?v=2"></script>
</body>
</html>
