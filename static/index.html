<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>文件传输助手</title>
  <meta name="theme-color" content="#f7f7f7" id="theme-color-meta">
  <link rel="manifest" href="/manifest.json?v=5">
  <link rel="shortcut icon" href="/favicon.ico?v=5" type="image/x-icon">
  <link rel="icon" href="/favicon.ico?v=5" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=5">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=5">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=5">
  <link rel="apple-touch-icon" href="/icon-192.png?v=5">
  <link rel="stylesheet" href="/css/style.css?v=46">
  <script>
    // iPadOS 13+ reports a Macintosh UA; tell it apart from a real Mac by touch support
    if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
        (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) {
      document.documentElement.classList.add('is-mobile');
    } else {
      document.documentElement.classList.add('is-desktop');
    }
  </script>
</head>
<body>
  <div id="app-container">
    <!-- Header -->
    <header>
      <div class="header-left">
        <div class="status-badge">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">正在连接…</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="open-qr-btn" title="扫码连接">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="5" height="5" x="3" y="3" rx="1"></rect>
            <rect width="5" height="5" x="16" y="3" rx="1"></rect>
            <rect width="5" height="5" x="3" y="16" rx="1"></rect>
            <path d="M21 16h-3a2 2 0 0 0-2 2v3"></path>
            <path d="M21 21v.01"></path>
            <path d="M12 7v3a2 2 0 0 1-2 2H7"></path>
            <path d="M3 12h.01"></path>
            <path d="M12 3h.01"></path>
            <path d="M12 16v.01"></path>
            <path d="M16 12h1"></path>
            <path d="M21 12v.01"></path>
            <path d="M12 21v-1"></path>
          </svg>
        </button>
        <button class="icon-btn" id="open-calendar-btn" title="按月份浏览">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2"></rect>
            <line x1="16" x2="16" y1="2" y2="6"></line>
            <line x1="8" x2="8" y1="2" y2="6"></line>
            <line x1="3" x2="21" y1="10" y2="10"></line>
          </svg>
        </button>

        <button class="icon-btn" id="toggle-search-btn" title="搜索记录">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <button class="icon-btn" id="open-settings-btn" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Month History Floating Banner -->
    <div id="history-banner" style="display: none;">
      <div class="history-banner-left">
        <div class="month-nav">
          <div class="month-dd" id="month-year-dd">
            <button type="button" class="month-nav-select month-dd-btn" id="month-year-btn" title="选择年份"></button>
            <div class="month-dd-list" id="month-year-list"></div>
          </div>
          <button id="month-prev-btn" class="month-nav-btn" title="上一个有记录的月份">‹</button>
          <div class="month-dd" id="month-month-dd">
            <button type="button" class="month-nav-select month-dd-btn" id="month-month-btn" title="选择月份"></button>
            <div class="month-dd-list" id="month-month-list"></div>
          </div>
          <button id="month-next-btn" class="month-nav-btn" title="下一个有记录的月份">›</button>
          <button id="month-current-btn" class="month-nav-today" title="跳到本月">本月</button>
        </div>
        <span class="history-banner-count" id="history-banner-count">共 0 条</span>
      </div>
    </div>

    <!-- Collapsible Search Bar -->
    <div id="search-bar">
      <input type="text" id="search-input" placeholder="搜索文字内容或文件名...">
      <button class="icon-btn" id="close-search-btn" title="清除搜索" aria-label="清除搜索"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <!-- Chat History Flow -->
    <main id="chat-history">
      <!-- Dynamic messages injected here -->
    </main>

    <!-- Footer Input Bar -->
    <footer>
      <div class="chat-input-box" id="chat-input-box">
        <textarea id="message-input" rows="3" placeholder="输入文字，或直接拖入 / 粘贴文件..."></textarea>
        <div class="chat-input-bottom">
          <div class="tool-buttons">
            <!-- Direct camera capture for mobile (Redmi K80 Pro) -->
            <label class="tool-btn" title="拍照直接上传" style="cursor:pointer;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
              <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
            </label>

            <!-- Photo / Video upload -->
            <label class="tool-btn" title="图片/视频" style="cursor:pointer;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <input type="file" id="media-input" accept="image/*,video/*" multiple style="display:none;">
            </label>

            <!-- Any File upload (PDF, ZIP, DOC, etc.) -->
            <label class="tool-btn" title="发送任意文件" style="cursor:pointer;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
              </svg>
              <input type="file" id="file-input" accept="*/*" multiple style="display:none;">
            </label>
          </div>

          <button class="send-btn" id="send-btn" title="发送 (Enter)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="20" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </footer>

    <!-- Drag and Drop Overlay -->
    <div id="drop-zone">
      <div class="drop-zone-card">
        <div class="drop-icon">📂</div>
        <div class="drop-title">释放文件立即传输</div>
        <div class="drop-subtitle">支持图片、视频、PDF、ZIP 等任意文件</div>
      </div>
    </div>
  </div>

  <!-- QR Code Modal -->
  <div class="modal-mask" id="qr-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title modal-title-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5M7 12h10"/></svg>扫码直连</div>
        <button class="close-btn" id="close-qr-modal" aria-label="关闭"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="modal-hint">
        请确保设备与这台电脑连接在<strong>同一个 Wi-Fi</strong> 网络下
      </div>
      <div id="qr-canvas-container"></div>
      <div class="qr-info-url">
        <span id="qr-url-text">http://...</span>
        <button class="qr-copy-btn" id="copy-url-btn" type="button">复制</button>
      </div>
      <div id="ip-switch-box" class="modal-hint" style="display:none;text-align:center;">
        <span>可选 IP: </span>
        <select id="ip-select" style="font-size:var(--fs-hint);padding:3px 8px;border-radius:4px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-main);"></select>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="connection-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">连接管理</div>
        <button class="close-btn" id="close-connection-modal" aria-label="关闭连接管理"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p id="connection-server" class="modal-text" style="overflow-wrap:anywhere;"></p>
      <p class="modal-hint">请保持本设备与电脑在可互通的网络中。更换电脑时，用手机相机扫描新电脑 LinkFlow 中的配对二维码，再打开链接。</p>
      <button class="connection-action" id="reconnect-btn">重新连接并同步消息</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-mask" id="settings-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">设置</div>
        <button class="close-btn" id="close-settings-modal" aria-label="关闭"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="setting-row">
          <div class="setting-label">设备名称</div>
          <input type="text" id="setting-device-name" class="setting-input" maxlength="32" autocomplete="off">
        </div>

        <div class="setting-row">
          <div class="setting-label">自动存入剪贴板</div>
          <label class="switch">
            <input type="checkbox" id="setting-auto-clipboard" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-label">深色模式</div>
          <label class="switch">
            <input type="checkbox" id="setting-dark-theme">
            <span class="slider"></span>
          </label>
        </div>

        <div style="border-top:1px solid var(--border-color);padding-top:12px;display:flex;flex-direction:column;gap:8px;">
          <div class="setting-row" id="clear-all-row">
            <div class="storage-info">
              <div class="setting-label">清空记录与文件</div>
              <div class="setting-sub" id="storage-stats-text">正在统计存储状态...</div>
            </div>
            <button class="danger-text-btn" id="clear-all-btn" type="button">清空</button>
          </div>
          <div class="modal-hint" id="app-version-text">
            正在读取版本…
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Clear-all confirmation (PC only): shows what will be lost and delays the destructive button. -->
  <div class="modal-mask" id="clear-confirm-modal" style="z-index:210;">
    <div class="modal-box" role="alertdialog" aria-labelledby="clear-confirm-title" aria-describedby="clear-confirm-text">
      <div class="modal-title" id="clear-confirm-title">清空所有记录与文件？</div>
      <div class="confirm-text" id="clear-confirm-text"></div>
      <div class="confirm-actions">
        <button class="confirm-btn" id="clear-confirm-cancel" type="button">取消</button>
        <button class="confirm-btn danger" id="clear-confirm-ok" type="button" disabled>清空</button>
      </div>
    </div>
  </div>

  <!-- Image Lightbox Modal -->
  <div id="lightbox-mask">
    <img id="lightbox-img" src="" alt="预览大图">
  </div>

  <!-- Toast Notification -->
  <div id="toast">已复制到剪贴板</div>

  <script src="/js/qrcode.min.js"></script>
  <script src="/js/icons.js?v=6"></script>
  <script src="/js/clipboard-files.js?v=1"></script>
  <script src="/js/download-progress.js?v=5"></script>
  <script src="/js/app.js?v=51"></script>
</body>
</html>
